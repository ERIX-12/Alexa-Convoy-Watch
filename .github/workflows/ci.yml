name: Convoy Watch CI

# NOTE: GitHub Actions runner is external to this AI Studio environment; this workflow is unverified locally.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run lint

      - name: Run Test & Conformance Suite
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Verify Production Entrypoint
        run: |
          test -f dist/server.js || exit 1
          test -f dist/index.html || exit 1
